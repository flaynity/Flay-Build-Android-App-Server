name: Flay Android APK Build

run-name: Flay APK Build - ${{ inputs.build_id }}

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: "Build job ID"
        required: true
        type: string
      app_name:
        description: "App name"
        required: true
        type: string
      technology:
        description: "Project technology"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Download project archive
        env:
          BUILD_SERVER_URL: https://flay-ai.flaynity.workers.dev
          BUILD_INTERNAL_TOKEN: ${{ secrets.BUILD_INTERNAL_TOKEN }}
          BUILD_ID: ${{ inputs.build_id }}
        run: |
          test -n "$BUILD_INTERNAL_TOKEN"
          curl --fail --location --retry 3 \
            -H "X-Build-Token: $BUILD_INTERNAL_TOKEN" \
            "$BUILD_SERVER_URL/internal/archive/$BUILD_ID" -o project.zip

      - name: Extract project
        run: |
          mkdir -p workspace
          unzip -q project.zip -d workspace
          rm -f project.zip

      - name: Find Android Gradle project
        id: project
        run: |
          ROOT="$(find workspace -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit | xargs -r dirname)"
          if [ -z "$ROOT" ]; then
            echo "No Android Gradle project found in uploaded archive."
            exit 1
          fi
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK (no legacy setup-android action)
        run: |
          set -e
          echo "Using direct Android SDK provisioning; android-actions/setup-android is intentionally not used."
          test -n "$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' -print -quit)"
          if [ -z "$SDKMANAGER" ]; then
            echo "No Android SDK command-line tools sdkmanager was found on the GitHub runner."
            exit 1
          fi
          export PATH="$(dirname "$SDKMANAGER"):$PATH"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "PATH=$PATH" >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.root }}
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon --stacktrace assembleDebug
          elif command -v gradle >/dev/null 2>&1; then
            gradle --no-daemon --stacktrace assembleDebug
          else
            echo "Gradle wrapper and system Gradle are both unavailable."
            exit 1
          fi

      - name: Locate APK
        id: apk
        working-directory: ${{ steps.project.outputs.root }}
        run: |
          APK="$(find . -type f -path '*/build/outputs/apk/*.apk' -print -quit)"
          if [ -z "$APK" ]; then
            echo "Gradle finished but no APK was produced."
            exit 1
          fi
          echo "path=$PWD/$APK" >> "$GITHUB_OUTPUT"

      - name: Upload APK to Flay gateway
        if: success()
        env:
          BUILD_SERVER_URL: https://flay-ai.flaynity.workers.dev
          BUILD_INTERNAL_TOKEN: ${{ secrets.BUILD_INTERNAL_TOKEN }}
          BUILD_ID: ${{ inputs.build_id }}
          APK_PATH: ${{ steps.apk.outputs.path }}
        run: |
          curl --fail --location --retry 3 \
            -X PUT \
            -H "X-Build-Token: $BUILD_INTERNAL_TOKEN" \
            -H "Content-Type: application/vnd.android.package-archive" \
            --data-binary "@$APK_PATH" \
            "$BUILD_SERVER_URL/internal/apk/$BUILD_ID"

      - name: Report build failure
        if: failure()
        env:
          BUILD_SERVER_URL: https://flay-ai.flaynity.workers.dev
          BUILD_INTERNAL_TOKEN: ${{ secrets.BUILD_INTERNAL_TOKEN }}
          BUILD_ID: ${{ inputs.build_id }}
        run: |
          curl --fail --location --retry 2 \
            -X POST \
            -H "X-Build-Token: $BUILD_INTERNAL_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"error":"GitHub Actions Android build failed. Check the workflow log for the exact Gradle error."}' \
            "$BUILD_SERVER_URL/internal/failed/$BUILD_ID" || true
